version: 2

models:
  - name: dm_consultations_analysis
    description: "Datamart pour analyses consultations - KPI 1, 2, 6"
    columns:
      - name: sk_temps
        description: "Clé temporelle"
        tests:
          - not_null
      
      - name: nb_consultations_etablissement
        description: "KPI 1: Nombre consultations par établissement"
      
      - name: nb_consultations_diagnostic
        description: "KPI 2: Nombre consultations par diagnostic"
      
      - name: nb_consultations_professionnel
        description: "KPI 6: Nombre consultations par professionnel"

  - name: dm_hospitalisations_analysis
    description: "Datamart pour analyses hospitalisations - KPI 3, 4, 5"
    columns:
      - name: nb_hospitalisations_total
        description: "KPI 3: Nombre total d'hospitalisations par période"
      
      - name: nb_hospitalisations_diagnostic
        description: "KPI 4: Nombre hospitalisations par diagnostic"
      
      - name: nb_hospitalisations_profil
        description: "KPI 5: Nombre hospitalisations par sexe et âge"
      
      - name: dms_moyenne
        description: "Durée Moyenne de Séjour (indicateur clé)"

  - name: dm_deces_analysis
    description: "Datamart pour analyses décès - KPI 7 (année 2019)"
    columns:
      - name: region
        description: "Région française"
        tests:
          - not_null
      
      - name: nb_deces_region
        description: "KPI 7: Nombre de décès par région (2019)"

  - name: dm_satisfaction_analysis
    description: "Datamart pour analyses satisfaction - KPI 8 (année 2020)"
    columns:
      - name: region
        description: "Région de l'établissement"
        tests:
          - not_null
      
      - name: taux_satisfaction_moyen_region
        description: "KPI 8: Taux global de satisfaction par région (2020)"

