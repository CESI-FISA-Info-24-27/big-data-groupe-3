version: '3.8'

# ============================================
# DOCKER COMPOSE COMPLET - CHU DWH + AIRFLOW
# ============================================
# 
# Services:
# - PostgreSQL DWH (port 5433) - Data Warehouse
# - PostgreSQL Airflow (port 5434) - Métadonnées Airflow
# - Airflow Webserver (port 8080) - Interface web
# - Airflow Scheduler - Orchestration
#
# Usage:
#   docker-compose up -d
#   
# Accès:
#   - Airflow UI: http://localhost:8080 (admin/admin)
#   - PostgreSQL DWH: localhost:5433 (admin/admin)
#   - PostgreSQL Airflow: localhost:5434 (airflow/airflow)
#
# Arrêt:
#   docker-compose down
# ============================================

# Configuration commune Airflow
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.7.3-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Variables pour les scripts Python
    DWH_POSTGRES_HOST: postgres-dwh
    DWH_POSTGRES_PORT: 5432
    DWH_POSTGRES_DB: healthcare_dwh
    DWH_POSTGRES_USER: admin
    DWH_POSTGRES_PASSWORD: admin
    # Source PostgreSQL (optionnel)
    SOURCE_POSTGRES_HOST: ${SOURCE_POSTGRES_HOST:-host.docker.internal}
    SOURCE_POSTGRES_PORT: ${SOURCE_POSTGRES_PORT:-5432}
    SOURCE_POSTGRES_DB: ${SOURCE_POSTGRES_DB:-chu_operationnel}
    SOURCE_POSTGRES_USER: ${SOURCE_POSTGRES_USER:-postgres}
    SOURCE_POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD:-postgres}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy

services:
  # ============================================
  # PostgreSQL DWH (Data Warehouse Final)
  # ============================================
  postgres-dwh:
    image: postgres:15
    container_name: chu-dwh
    environment:
      POSTGRES_DB: healthcare_dwh
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data
      - ./scripts/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "healthcare_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chu-network

  # ============================================
  # PostgreSQL Airflow (Métadonnées)
  # ============================================
  postgres-airflow:
    image: postgres:15
    container_name: chu-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chu-network

  # ============================================
  # Airflow Webserver (Interface Web)
  # ============================================
  airflow-webserver:
    <<: *airflow-common
    container_name: chu-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - chu-network

  # ============================================
  # Airflow Scheduler (Orchestrateur)
  # ============================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: chu-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - chu-network

  # ============================================
  # Airflow Init (Initialisation)
  # ============================================
  airflow-init:
    <<: *airflow-common
    container_name: chu-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Créer les répertoires nécessaires
        mkdir -p /sources/logs /sources/dags /sources/config
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,config}
        
        # Installer les dépendances Python supplémentaires
        pip install --no-cache-dir duckdb>=0.9.0 dbt-core>=1.7.0 dbt-duckdb>=1.7.0 python-dotenv>=1.0.0 colorama>=0.4.6
        
        # Initialiser Airflow
        airflow db init
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@chu-dwh.local \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
        
        echo "✅ Airflow initialisé avec succès"
        echo "   URL: http://localhost:8080"
        echo "   User: ${_AIRFLOW_WWW_USER_USERNAME:-admin}"
        echo "   Password: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources
    networks:
      - chu-network

# ============================================
# Volumes Persistants
# ============================================
volumes:
  postgres-dwh-data:
    driver: local
  postgres-airflow-data:
    driver: local

# ============================================
# Network
# ============================================
networks:
  chu-network:
    driver: bridge
